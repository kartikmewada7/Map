<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TomTom Map - A* Pathfinding</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- TomTom Maps SDK -->
    <link rel="stylesheet" type="text/css" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">
    <script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a; /* fallback dark background */
        }
        
        /* CRITICAL: The map container must have explicit dimensions */
        #map-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            min-height: 600px; /* Requested requirement */
            z-index: 1;
            background-color: #1e293b; 
        }

        /* Glassmorphism Panel */
        .control-panel {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 50;
        }

        /* Custom Markers */
        .marker-start {
            background-color: #10b981;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
            transform: translate(-50%, -50%);
        }
        
        .marker-target {
            background-color: #ef4444;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body class="text-slate-100">

    <!-- The Map Container -->
    <div id="map-container"></div>

    <!-- UI Overlay -->
    <div class="absolute top-4 left-4 w-96 max-w-[calc(100vw-2rem)] control-panel rounded-xl shadow-2xl p-5 flex flex-col gap-4">
        
        <div class="flex items-center gap-3 border-b border-slate-700 pb-4">
            <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-map-location-dot text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-white leading-tight">TomTom A* Mapper</h1>
                <p class="text-xs text-slate-400">Pathfinding Visualization</p>
            </div>
        </div>

        <!-- Initialization Section -->
        <div id="init-section" class="flex flex-col gap-3">
            <label class="text-sm font-medium text-slate-300">Enter TomTom API Key:</label>
            <input type="text" id="api-key" placeholder="Your API Key..." 
                class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500 transition-colors">
            <button id="load-map-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-4 rounded-lg transition-colors text-sm shadow-lg shadow-blue-500/20">
                <i class="fa-solid fa-spinner fa-spin hidden mr-2" id="loading-spinner"></i>Load Map
            </button>
            <p class="text-xs text-slate-500 text-center"><a href="https://developer.tomtom.com/" target="_blank" class="underline hover:text-blue-400">Get an API key</a></p>
        </div>

        <!-- Controls Section (Hidden until map loads) -->
        <div id="controls-section" class="hidden flex-col gap-3">
            <div class="bg-slate-800 rounded-lg p-3 border border-slate-700">
                <p class="text-sm text-slate-300 font-medium mb-2">Instructions:</p>
                <ol class="text-xs text-slate-400 list-decimal ml-4 space-y-1">
                    <li>Click map to set <strong class="text-emerald-400">Start</strong>.</li>
                    <li>Click map to set <strong class="text-red-400">Target</strong>.</li>
                    <li>Click Run to visualize A*.</li>
                </ol>
            </div>

            <div class="flex gap-2">
                <button id="run-algo-btn" disabled class="flex-1 bg-emerald-600 disabled:bg-slate-700 disabled:text-slate-500 hover:bg-emerald-500 text-white font-medium py-2 px-4 rounded-lg transition-colors text-sm">
                    Run A* Algorithm
                </button>
                <button id="clear-btn" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 px-4 rounded-lg transition-colors text-sm">
                    Clear
                </button>
            </div>
        </div>

        <!-- Status Message Box -->
        <div id="status-box" class="bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-slate-400 font-mono">
            Status: Waiting for API Key...
        </div>
    </div>

    <script>
        // --- State Variables ---
        let map = null;
        let startPoint = null; // { lng, lat }
        let targetPoint = null; // { lng, lat }
        let startMarker = null;
        let targetMarker = null;
        
        let gridNodes = []; // The virtual grid for A*
        let obstacles = []; // Random obstacles generated between points
        
        // --- UI Elements ---
        const ui = {
            apiKeyInput: document.getElementById('api-key'),
            loadMapBtn: document.getElementById('load-map-btn'),
            spinner: document.getElementById('loading-spinner'),
            initSection: document.getElementById('init-section'),
            controlsSection: document.getElementById('controls-section'),
            statusBox: document.getElementById('status-box'),
            runAlgoBtn: document.getElementById('run-algo-btn'),
            clearBtn: document.getElementById('clear-btn')
        };

        function updateStatus(msg, type = 'info') {
            ui.statusBox.textContent = `> ${msg}`;
            if (type === 'error') ui.statusBox.className = 'bg-red-900/50 border border-red-700 rounded-lg p-3 text-xs text-red-200 font-mono';
            else if (type === 'success') ui.statusBox.className = 'bg-emerald-900/50 border border-emerald-700 rounded-lg p-3 text-xs text-emerald-200 font-mono';
            else ui.statusBox.className = 'bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-slate-400 font-mono';
        }

        // --- Map Initialization ---
        ui.loadMapBtn.addEventListener('click', () => {
            const key = ui.apiKeyInput.value.trim();
            if (!key) {
                updateStatus("Error: API Key is required.", "error");
                return;
            }

            ui.loadMapBtn.disabled = true;
            ui.spinner.classList.remove('hidden');
            updateStatus("Initializing map...");

            try {
                // Initialize TomTom Map
                map = tt.map({
                    key: key,
                    container: 'map-container',
                    center: [-74.0060, 40.7128], // Default to NYC
                    zoom: 12,
                    style: 'tomtom://vector/1/basic-main'
                });

                map.on('load', () => {
                    ui.spinner.classList.add('hidden');
                    ui.initSection.classList.add('hidden');
                    ui.controlsSection.classList.remove('hidden');
                    ui.controlsSection.classList.add('flex');
                    updateStatus("Map loaded successfully. Click to set start point.", "success");
                    
                    setupMapLayers();
                    setupMapInteractions();
                });

                map.on('error', (err) => {
                    console.error("TomTom Map Error:", err);
                    updateStatus("Map failed to load. Check API Key or Console.", "error");
                    ui.loadMapBtn.disabled = false;
                    ui.spinner.classList.add('hidden');
                });

            } catch (err) {
                console.error(err);
                updateStatus("Critical Error initializing SDK.", "error");
                ui.loadMapBtn.disabled = false;
                ui.spinner.classList.add('hidden');
            }
        });

        function setupMapLayers() {
            // Source & Layer for Obstacles (Walls)
            map.addSource('obstacles-source', {
                'type': 'geojson',
                'data': { 'type': 'FeatureCollection', 'features': [] }
            });
            map.addLayer({
                'id': 'obstacles-layer',
                'type': 'fill',
                'source': 'obstacles-source',
                'paint': {
                    'fill-color': '#1e293b',
                    'fill-opacity': 0.8,
                    'fill-outline-color': '#000000'
                }
            });

            // Source & Layer for Visited Nodes (Visualization)
            map.addSource('visited-source', {
                'type': 'geojson',
                'data': { 'type': 'FeatureCollection', 'features': [] }
            });
            map.addLayer({
                'id': 'visited-layer',
                'type': 'circle',
                'source': 'visited-source',
                'paint': {
                    'circle-color': '#38bdf8',
                    'circle-radius': 6,
                    'circle-opacity': 0.6
                }
            });

            // Source & Layer for Final Path
            map.addSource('path-source', {
                'type': 'geojson',
                'data': { 'type': 'Feature', 'geometry': { 'type': 'LineString', 'coordinates': [] } }
            });
            map.addLayer({
                'id': 'path-layer',
                'type': 'line',
                'source': 'path-source',
                'layout': {
                    'line-cap': 'round',
                    'line-join': 'round'
                },
                'paint': {
                    'line-color': '#fde047',
                    'line-width': 6,
                    'line-opacity': 0.9
                }
            });
        }

        function setupMapInteractions() {
            map.on('click', (e) => {
                const lngLat = e.lngLat;
                
                if (!startPoint) {
                    startPoint = lngLat;
                    const el = document.createElement('div');
                    el.className = 'marker-start';
                    startMarker = new tt.Marker({ element: el }).setLngLat(startPoint).addTo(map);
                    updateStatus("Start point set. Click to set target.");
                } else if (!targetPoint) {
                    targetPoint = lngLat;
                    const el = document.createElement('div');
                    el.className = 'marker-target';
                    targetMarker = new tt.Marker({ element: el }).setLngLat(targetPoint).addTo(map);
                    updateStatus("Target set. Ready to run A*.");
                    ui.runAlgoBtn.disabled = false;
                }
            });
        }

        ui.clearBtn.addEventListener('click', clearMap);

        function clearMap() {
            if (startMarker) startMarker.remove();
            if (targetMarker) targetMarker.remove();
            startPoint = null;
            targetPoint = null;
            startMarker = null;
            targetMarker = null;
            gridNodes = [];
            
            // Reset GeoJSON sources
            if (map.getSource('visited-source')) {
                map.getSource('visited-source').setData({ 'type': 'FeatureCollection', 'features': [] });
                map.getSource('path-source').setData({ 'type': 'Feature', 'geometry': { 'type': 'LineString', 'coordinates': [] } });
                map.getSource('obstacles-source').setData({ 'type': 'FeatureCollection', 'features': [] });
            }
            
            ui.runAlgoBtn.disabled = true;
            updateStatus("Cleared. Click map to set start point.", "info");
        }

        function generateVirtualGrid(cols, rows) {
            // Find bounds encompassing start and target with padding
            const minLng = Math.min(startPoint.lng, targetPoint.lng);
            const maxLng = Math.max(startPoint.lng, targetPoint.lng);
            const minLat = Math.min(startPoint.lat, targetPoint.lat);
            const maxLat = Math.max(startPoint.lat, targetPoint.lat);

            // Add 30% padding to bounds
            const lngPad = (maxLng - minLng) * 0.3 || 0.01;
            const latPad = (maxLat - minLat) * 0.3 || 0.01;
            
            const bMinLng = minLng - lngPad;
            const bMaxLng = maxLng + lngPad;
            const bMinLat = minLat - latPad;
            const bMaxLat = maxLat + latPad;

            const lngStep = (bMaxLng - bMinLng) / cols;
            const latStep = (bMaxLat - bMinLat) / rows;

            let grid = [];
            for (let x = 0; x < cols; x++) {
                grid[x] = [];
                for (let y = 0; y < rows; y++) {
                    const cLng = bMinLng + (x * lngStep) + (lngStep / 2);
                    const cLat = bMinLat + (y * latStep) + (latStep / 2);
                    
                    // Create obstacles (roughly 25% chance, but ensuring start/target areas are relatively clear)
                    let isWall = Math.random() < 0.25;
                    
                    grid[x][y] = {
                        x, y,
                        lng: cLng,
                        lat: cLat,
                        lngStep, latStep,
                        g: Infinity,
                        h: 0,
                        f: Infinity,
                        parent: null,
                        isWall: isWall
                    };
                }
            }
            return grid;
        }

        function getClosestNode(lngLat, grid, cols, rows) {
            let closest = null;
            let minDist = Infinity;
            for(let x = 0; x < cols; x++) {
                for(let y = 0; y < rows; y++) {
                    const node = grid[x][y];
                    // Euclidean distance approximation for assigning grid node
                    const dist = Math.pow(node.lng - lngLat.lng, 2) + Math.pow(node.lat - lngLat.lat, 2);
                    if (dist < minDist) {
                        minDist = dist;
                        closest = node;
                    }
                }
            }
            if(closest) closest.isWall = false; // Ensure start/target are not walls
            return closest;
        }

        function drawObstacles(grid, cols, rows) {
            let features = [];
            for (let x = 0; x < cols; x++) {
                for (let y = 0; y < rows; y++) {
                    const node = grid[x][y];
                    if (node.isWall) {
                        // Create a small polygon for the obstacle
                        const halfW = node.lngStep / 2.2; // slight gap
                        const halfH = node.latStep / 2.2;
                        features.push({
                            'type': 'Feature',
                            'geometry': {
                                'type': 'Polygon',
                                'coordinates': [[
                                    [node.lng - halfW, node.lat - halfH],
                                    [node.lng + halfW, node.lat - halfH],
                                    [node.lng + halfW, node.lat + halfH],
                                    [node.lng - halfW, node.lat + halfH],
                                    [node.lng - halfW, node.lat - halfH]
                                ]]
                            }
                        });
                    }
                }
            }
            map.getSource('obstacles-source').setData({
                'type': 'FeatureCollection',
                'features': features
            });
        }

        function heuristic(nodeA, nodeB) {
            // Manhattan distance on grid
            return Math.abs(nodeA.x - nodeB.x) + Math.abs(nodeA.y - nodeB.y);
        }

        ui.runAlgoBtn.addEventListener('click', () => {
            if (!startPoint || !targetPoint) return;
            
            ui.runAlgoBtn.disabled = true;
            ui.clearBtn.disabled = true;
            updateStatus("Generating Grid & Running A*...");

            const COLS = 40;
            const ROWS = 40;
            const grid = generateVirtualGrid(COLS, ROWS);
            
            let startNode = getClosestNode(startPoint, grid, COLS, ROWS);
            let targetNode = getClosestNode(targetPoint, grid, COLS, ROWS);
            
            // Clear space around start and target to prevent immediate lock-in
            for(let dx=-1; dx<=1; dx++) {
                for(let dy=-1; dy<=1; dy++) {
                    if(grid[startNode.x+dx] && grid[startNode.x+dx][startNode.y+dy]) grid[startNode.x+dx][startNode.y+dy].isWall = false;
                    if(grid[targetNode.x+dx] && grid[targetNode.x+dx][targetNode.y+dy]) grid[targetNode.x+dx][targetNode.y+dy].isWall = false;
                }
            }

            drawObstacles(grid, COLS, ROWS);

            // A* Execution
            let openSet = [startNode];
            let closedSet = new Set();
            startNode.g = 0;
            startNode.f = heuristic(startNode, targetNode);
            
            let visitedInOrder = [];
            let pathFound = false;

            while (openSet.length > 0) {
                // Get node with lowest F score
                openSet.sort((a, b) => a.f - b.f);
                let current = openSet.shift();

                visitedInOrder.push(current);

                if (current === targetNode) {
                    pathFound = true;
                    break;
                }

                closedSet.add(`${current.x},${current.y}`);

                // Get Neighbors (Up, Down, Left, Right)
                const dirs = [[0,1], [1,0], [0,-1], [-1,0]];
                for (let dir of dirs) {
                    const nx = current.x + dir[0];
                    const ny = current.y + dir[1];

                    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
                    
                    let neighbor = grid[nx][ny];
                    if (neighbor.isWall || closedSet.has(`${nx},${ny}`)) continue;

                    let tentativeG = current.g + 1;
                    
                    let inOpen = openSet.includes(neighbor);
                    if (!inOpen || tentativeG < neighbor.g) {
                        neighbor.g = tentativeG;
                        neighbor.h = heuristic(neighbor, targetNode);
                        neighbor.f = neighbor.g + neighbor.h;
                        neighbor.parent = current;
                        
                        if (!inOpen) openSet.push(neighbor);
                    }
                }
            }

            let path = [];
            if (pathFound) {
                let curr = targetNode;
                while (curr) {
                    path.unshift(curr);
                    curr = curr.parent;
                }
            }

            animateVisualization(visitedInOrder, path);
        });

        function animateVisualization(visitedNodes, path) {
            let visitedFeatures = [];
            let index = 0;
            
            updateStatus("Visualizing algorithm search...");

            function drawNextBatch() {
                // Draw 5 nodes per frame for faster visualization
                for (let i = 0; i < 5; i++) {
                    if (index >= visitedNodes.length) {
                        finishAnimation(path);
                        return;
                    }
                    const node = visitedNodes[index];
                    visitedFeatures.push({
                        'type': 'Feature',
                        'geometry': {
                            'type': 'Point',
                            'coordinates': [node.lng, node.lat]
                        }
                    });
                    index++;
                }

                map.getSource('visited-source').setData({
                    'type': 'FeatureCollection',
                    'features': visitedFeatures
                });

                requestAnimationFrame(drawNextBatch);
            }

            requestAnimationFrame(drawNextBatch);
        }

        function finishAnimation(path) {
            if (path.length === 0) {
                updateStatus("No path found! Surrounded by obstacles.", "error");
                ui.clearBtn.disabled = false;
                return;
            }

            updateStatus("Path found! Drawing shortest route...", "success");
            
            // Re-interpolate path coordinates to perfectly match original Start/Target markers 
            // rather than grid cell centers at the ends.
            let lineCoords = path.map(node => [node.lng, node.lat]);
            lineCoords[0] = [startPoint.lng, startPoint.lat];
            lineCoords[lineCoords.length - 1] = [targetPoint.lng, targetPoint.lat];

            map.getSource('path-source').setData({
                'type': 'Feature',
                'geometry': {
                    'type': 'LineString',
                    'coordinates': lineCoords
                }
            });

            ui.clearBtn.disabled = false;
        }

    </script>
</body>
</html>
